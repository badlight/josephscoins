<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Joseph's Ancient Coins — a personal collection of Roman Imperial, Roman Provincial, and Byzantine coinage.">
  <meta name="theme-color" content="#f5f0e6">
  <title>Joseph's Ancient Coins</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Joseph's Ancient Coins</h1>
      <p id="collectionCount" class="collection-count" aria-live="polite">Loading collection…</p>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Collection filters">
      <label class="search-control">
        <span>Search</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Ruler, mint, denomination, reference…">
      </label>

      <label>
        <span>Collection</span>
        <select id="collectionFilter">
          <option value="">All collections</option>
        </select>
      </label>

      <label>
        <span>Ruler</span>
        <select id="rulerFilter">
          <option value="">All rulers</option>
        </select>
      </label>

      <label>
        <span>Mint</span>
        <select id="mintFilter">
          <option value="">All mints</option>
        </select>
      </label>

      <label>
        <span>Denomination</span>
        <select id="denominationFilter">
          <option value="">All denominations</option>
        </select>
      </label>

      <button id="clearFilters" class="clear-button" type="button">Clear</button>
    </section>

    <section class="results-bar" aria-live="polite">
      <span id="resultCount"></span>
    </section>

    <section id="coinGrid" class="coin-grid" aria-label="Ancient coin collection"></section>

    <section id="emptyState" class="empty-state" hidden>
      <p>No coins match the selected filters.</p>
    </section>

    <section id="errorState" class="empty-state" hidden>
      <p>The collection could not be loaded.</p>
    </section>
  </main>

  <dialog id="coinDialog" class="coin-dialog">
    <button id="dialogClose" class="dialog-close" type="button" aria-label="Close">×</button>
    <div id="dialogContent"></div>
  </dialog>
</body>
</html>
